<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="pickleball-scene.css" />
  </head>
  <body>
    <div id="root" data-composition-id="main" data-duration="12" data-width="1920" data-height="1080">
      <div id="golden-hour-scene" class="clip" data-start="0" data-duration="12" data-track-index="0">
        <img class="scene-photo" src="assets/golden-hour-court.png" alt="" />
        <div class="scene-scrim"></div>
        <div class="scene-ball"><canvas id="ballCanvas"></canvas></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines.main = gsap.timeline({ paused: true });
    </script>
    <script type="module">
      import { createPickleball } from './assets/pickleball-3d.js';
      const ball = createPickleball(document.getElementById('ballCanvas'), { width: 620, height: 620, pixelRatio: 1 });
      window.addEventListener('hf-seek', (event) => ball.renderAt(event.detail.time / 12));
      ball.renderAt((window.__hfThreeTime || 0) / 12);
    </script>
  </body>
</html>
