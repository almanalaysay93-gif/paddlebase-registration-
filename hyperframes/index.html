<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="court.css" />
    <style>
      html, body, #root { width: 1920px; height: 1080px; }
      .stage { transform: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="scene" class="clip" data-start="0" data-duration="12" data-track-index="0">
        <div class="stage" id="stage">
          <div class="layer" data-depth="0"><div class="backdrop"></div></div>
          <div class="layer" data-depth="1">
            <div class="stripe stripe--c"></div>
            <div class="stripe stripe--a"></div>
            <div class="stripe stripe--b"></div>
          </div>
          <div class="layer" data-depth="2">
            <svg class="net" viewBox="0 0 2120 230" preserveAspectRatio="none" aria-hidden="true">
              <defs>
                <pattern id="mesh" width="22" height="22" patternUnits="userSpaceOnUse">
                  <path d="M0 0H22M0 0V22" stroke="#050b07" stroke-width="3" fill="none" />
                </pattern>
              </defs>
              <rect x="0" y="10" width="2120" height="200" fill="url(#mesh)" />
              <rect x="0" y="0" width="2120" height="14" fill="#0a0f0c" />
              <rect x="0" y="206" width="2120" height="10" fill="#0a0f0c" />
            </svg>
          </div>
          <div class="layer" data-depth="3">
            <div class="floor" data-layout-allow-overflow>
              <svg viewBox="0 0 2320 520" preserveAspectRatio="none" aria-hidden="true">
                <polygon points="0,250 2320,470 2320,520 0,330" fill="#f6f5ee" opacity="0.92" />
                <polygon points="0,40 2320,120 2320,134 0,52" fill="#f6f5ee" opacity="0.55" />
              </svg>
            </div>
          </div>
          <div class="layer" data-depth="4" id="hero">
            <div class="paddle-shadow" id="paddleShadow"></div>
            <div class="paddle" id="paddle">
              <svg viewBox="0 0 560 760" aria-hidden="true">
                <defs>
                  <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#2a2f2c" />
                    <stop offset="1" stop-color="#0c0f0d" />
                  </linearGradient>
                  <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0" stop-color="#1b1d1c" />
                    <stop offset="0.5" stop-color="#3a3d3b" />
                    <stop offset="1" stop-color="#0d0e0d" />
                  </linearGradient>
                  <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
                    <circle cx="6" cy="6" r="2.4" fill="#000" opacity="0.6" />
                  </pattern>
                  <clipPath id="headClip"><rect x="40" y="20" width="480" height="500" rx="150" /></clipPath>
                </defs>
                <g transform="rotate(-28 280 420)">
                  <rect x="236" y="500" width="88" height="250" rx="34" fill="url(#grip)" />
                  <rect x="236" y="500" width="88" height="250" rx="34" fill="url(#dots)" />
                  <rect x="32" y="12" width="496" height="516" rx="158" fill="#0a0c0b" />
                  <rect x="40" y="20" width="480" height="500" rx="150" fill="url(#face)" />
                  <g clip-path="url(#headClip)">
                    <path d="M120 120 H300 A150 150 0 0 1 300 420 H210 V340 H300 A70 70 0 0 0 300 200 H200 V470 H120 Z" fill="#d4f73a" />
                    <path d="M90 90 H310 A180 180 0 0 1 310 450 H90" fill="none" stroke="#d4f73a" stroke-width="8" />
                    <rect x="430" y="20" width="26" height="520" fill="#d4f73a" opacity="0.7" />
                    <rect x="40" y="20" width="480" height="500" fill="url(#dots)" opacity="0.18" />
                  </g>
                  <rect x="40" y="20" width="480" height="500" rx="150" fill="none" stroke="#3b403d" stroke-width="5" />
                </g>
              </svg>
            </div>
            <div class="ball-shadow" id="ballShadow"></div>
            <div class="ball" id="ball">
              <svg viewBox="0 0 260 260" aria-hidden="true">
                <defs>
                  <radialGradient id="ballFill" cx="0.36" cy="0.32" r="0.75">
                    <stop offset="0" stop-color="#f6ff9a" />
                    <stop offset="0.45" stop-color="#dcf53a" />
                    <stop offset="1" stop-color="#7d9612" />
                  </radialGradient>
                  <clipPath id="ballClip"><circle cx="130" cy="130" r="128" /></clipPath>
                </defs>
                <circle cx="130" cy="130" r="128" fill="url(#ballFill)" />
                <g clip-path="url(#ballClip)">
                  <g id="holes" fill="#8aa514" opacity="0.85">
                    <circle cx="130" cy="40" r="13" /><circle cx="75" cy="70" r="13" /><circle cx="185" cy="70" r="13" />
                    <circle cx="40" cy="130" r="12" /><circle cx="105" cy="115" r="14" /><circle cx="160" cy="115" r="14" />
                    <circle cx="220" cy="130" r="12" /><circle cx="70" cy="180" r="13" /><circle cx="130" cy="170" r="14" />
                    <circle cx="190" cy="180" r="13" /><circle cx="130" cy="225" r="12" /><circle cx="35" cy="75" r="9" />
                    <circle cx="225" cy="75" r="9" /><circle cx="35" cy="190" r="9" /><circle cx="225" cy="190" r="9" />
                  </g>
                </g>
                <circle cx="130" cy="130" r="128" fill="none" stroke="#6f8710" stroke-width="2" opacity="0.6" />
              </svg>
            </div>
          </div>
          <div class="layer" data-depth="5">
            <div class="flare" style="left: 1340px; top: 80px"></div>
            <div class="flare" style="left: 260px; top: 360px"></div>
          </div>
        </div>
        <div class="vignette"></div>
      </div>
    </div>
    <script src="bg.js"></script>
    <script>
      var tl = gsap.timeline({ paused: true });
      buildCourt(tl);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
